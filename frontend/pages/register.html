<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101d34">
  <title>Create account | Predictive Maintenance</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="auth-page auth-page-simple">
  <main class="auth-card register-card">
    <a class="brand-lockup brand-lockup-dark" href="../login.html"><span class="brand-mark">PM</span><span>Predictive Maintenance</span></a>
    <p class="eyebrow">VIEWER REGISTRATION</p>
    <h1>Create your account</h1>
    <p class="muted">Public registration creates a read-only Viewer account. An Admin can later assign another role.</p>
    <form id="register-form" class="form-stack">
      <label for="full-name">Full name</label>
      <input id="full-name" name="full_name" type="text" autocomplete="name" minlength="2" maxlength="120" placeholder="Your full name" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="At least 10 characters" required>
      <button id="register-submit" class="button button-primary button-full" type="submit">Create account</button>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
    <div class="auth-footer"><a href="../login.html">Back to sign in</a></div>
  </main>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
